name: Deploy to GCP Testing Server

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to confirm this manual deploy'
        required: true

jobs:
  deploy:
    name: Deploy to GCP Testing VM
    runs-on: ubuntu-24.04

    steps:

      - name: Verify confirmation input
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "deploy" ]; then
            echo "Confirmation text did not match 'deploy'. Aborting."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare SSH key
        shell: bash
        env:
          SSH_KEY_B64: ${{ secrets.GCP_SSH_PRIVATE_KEY_B64 }}
        run: |
          set -e

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s' "$SSH_KEY_B64" | base64 --decode > ~/.ssh/gcp_deploy_key

          chmod 600 ~/.ssh/gcp_deploy_key

          ssh-keygen -y \
            -f ~/.ssh/gcp_deploy_key \
            > /dev/null

          echo "SSH private key validated"

      - name: Add GCP server to known hosts
        env:
          GCP_HOST: ${{ secrets.GCP_HOST }}
        run: |
          ssh-keyscan -H "$GCP_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy application code
        env:
          GCP_HOST: ${{ secrets.GCP_HOST }}
          GCP_USERNAME: ${{ secrets.GCP_USERNAME }}
        run: |
          set -e

          echo "Deploying application files..."

          rsync -avz \
            --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='venv/' \
            --exclude='__pycache__/' \
            --exclude='*.pyc' \
            --exclude='config/medsum_config.yaml' \
            --exclude='credentials/service_account.json' \
            --exclude='results/' \
            --exclude='medsum_test.log' \
            -e "ssh -i ~/.ssh/gcp_deploy_key -o IdentitiesOnly=yes" \
            ./ \
            "$GCP_USERNAME@$GCP_HOST:/home/developers/medsum-load-test/"

          echo "Application code deployed successfully"

      - name: Install server dependencies
        env:
          GCP_HOST: ${{ secrets.GCP_HOST }}
          GCP_USERNAME: ${{ secrets.GCP_USERNAME }}
        run: |
          set -e

          ssh \
            -i ~/.ssh/gcp_deploy_key \
            -o IdentitiesOnly=yes \
            "$GCP_USERNAME@$GCP_HOST" \
            '
              set -e

              cd /home/developers/medsum-load-test

              echo "Activating virtual environment"
              source venv/bin/activate

              echo "Installing base requirements"
              python -m pip install -r requirements.txt

              if [ -f requirements_medsum.txt ]; then
                echo "Installing MedSum testing requirements"
                python -m pip install -r requirements_medsum.txt
              fi

              echo "Checking Python dependencies"
              python -m pip check

              echo "Deployment completed successfully"
            '