name: Deploy to GCP Testing Server

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to confirm this manual deploy'
        required: true

jobs:
  deploy:
    name: Deploy to GCP Testing VM
    runs-on: ubuntu-24.04

    steps:
      - name: Verify confirmation input
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "deploy" ]; then
            echo "Confirmation text did not match 'deploy'. Aborting."
            exit 1
          fi

      - name: Prepare SSH private key
        shell: bash
        env:
          SSH_KEY_B64: ${{ secrets.GCP_SSH_PRIVATE_KEY_B64 }}
        run: |
          set -e

          umask 077

          printf '%s' "$SSH_KEY_B64" | base64 --decode > "$GITHUB_WORKSPACE/gcp_deploy_key"

          chmod 600 "$GITHUB_WORKSPACE/gcp_deploy_key"

          echo "Validating private key..."

          ssh-keygen -y \
            -f "$GITHUB_WORKSPACE/gcp_deploy_key" \
            > /dev/null

          echo "SSH private key parsed successfully"

      - name: Test SSH connection
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GCP_HOST }}
          username: ${{ secrets.GCP_USERNAME }}
          key_path: /github/workspace/gcp_deploy_key
          port: 22
          command_timeout: 15m

          script: |
            set -e

            echo "SSH connection successful"
            whoami
            hostname
            pwd